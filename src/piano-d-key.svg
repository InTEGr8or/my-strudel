<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 72" width="66" height="72" class="piano-diagram piano-d-key" role="group" aria-labelledby="dKeyTitle">
  <title id="dKeyTitle">D is the white key with a lone black key on each side. Tap a key to hear it.</title>
  <!-- C4 D4 E4, same sizes as the compact staff-player keys -->
  <g class="diagram-key white" data-midi="60" data-note="c4" role="button" aria-label="C4" fill="#fff" stroke="#444" stroke-width="1">
    <path d="M0.5 0.5 H21.5 V66 A6 6 0 0 1 15.5 71.5 H6.5 A6 6 0 0 1 0.5 66 Z"/>
  </g>
  <g class="diagram-key white" data-midi="62" data-note="d4" role="button" aria-label="D4" fill="#fff" stroke="#444" stroke-width="1">
    <path d="M22.5 0.5 H43.5 V66 A6 6 0 0 1 37.5 71.5 H28.5 A6 6 0 0 1 22.5 66 Z"/>
    <text x="33" y="62" text-anchor="middle" font-size="9" font-family="sans-serif" font-weight="700" fill="#222">D</text>
  </g>
  <g class="diagram-key white" data-midi="64" data-note="e4" role="button" aria-label="E4" fill="#fff" stroke="#444" stroke-width="1">
    <path d="M44.5 0.5 H65.5 V66 A6 6 0 0 1 59.5 71.5 H50.5 A6 6 0 0 1 44.5 66 Z"/>
  </g>
  <g class="diagram-key black" data-midi="61" data-note="cs4" role="button" aria-label="C sharp 4" fill="#111" stroke="#000" stroke-width="1">
    <rect x="15" y="0.5" width="14" height="41.5" rx="1"/>
  </g>
  <g class="diagram-key black" data-midi="63" data-note="ds4" role="button" aria-label="D sharp 4" fill="#111" stroke="#000" stroke-width="1">
    <rect x="37" y="0.5" width="14" height="41.5" rx="1"/>
  </g>
</svg>
